<script>
  // 首帧前按本地时间先铺好天色，避免夜里白屏一闪
  (function () {
    var q = new URLSearchParams(location.search), d = new Date();
    var h = q.has('hour') ? parseFloat(q.get('hour')) : d.getHours() + d.getMinutes() / 60;
    var c = h < 4.9 || h >= 19.5 ? '#121726' : h < 5.6 || h >= 18.7 ? '#40456a' : h < 6.6 || h >= 17.6 ? '#e6d2c8' : '#fbfaf7';
    document.documentElement.style.background = c;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', c);
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { background: #fbfaf7; transition: background-color 1.5s linear; }
  body {
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>

<script type="module" src="/js/main.js"></script>
