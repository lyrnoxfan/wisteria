<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<meta name="description" content="藤 — 一棵挂在网上的日本紫藤">
<title>藤</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#fbfaf7}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;animation:enter 2.4s ease both}
  @keyframes enter{from{opacity:0}to{opacity:1}}
  #s{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #s:active{cursor:grabbing}
  @media (prefers-reduced-motion:reduce){body{animation:none}}
</style>
</head>
<body>
<canvas id="s"></canvas>
<script>
"use strict";
/* ============================================================
   藤 — 日本紫藤 · 藤棚式伞形树冠
   留白 / 动画风 / 程序化
   风(阵风+风声) · 鸟 · 远处鸟鸣 · 叶动声 · 树下驻足的行人
   触摸：手指拨开枝叶，划动可拨乱并打落花瓣
   ============================================================ */
// 每次进入都不同：真随机种子（?seed=123 可固定复现）
const SEED = (() => {
  const q = new URLSearchParams(location.search).get('seed');
  if (q !== null) return parseInt(q, 10) >>> 0;
  return ((Date.now() % 2147483647) ^ (Math.random() * 0x7fffffff)) >>> 0;
})();
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(SEED);
const R = (a, b) => a + rnd() * (b - a);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const cv = document.getElementById('s'), ctx = cv.getContext('2d');
const dpr = Math.min(devicePixelRatio || 1, 2);
let W = 0, H = 0, S = 1;
let treeDW = 0, treeDH = 0, treeX0 = 0, treeY0 = 0; // 树图绘制矩形
let groundY = 0;
let windDirS = 1;
let frameDt = 0.016;

function size(){
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const portrait = H > W * 1.15;
  S = clamp(Math.min(W, H) / 750, 0.68, 1);
  // 树图：按高适配，居中，根部略出底边；每次随机微调大小和位置
  const tScale = R(0.94, 1.06), tShift = R(-0.04, 0.04);
  treeDH = H * 0.98 * tScale;
  treeDW = treeDH * (520 / 1040);
  treeX0 = (W - treeDW) / 2 + W * tShift;
  treeY0 = H * 1.015 - treeDH;
  groundY = H * 0.94;
}

/* ================= 树（图片素材 + 动态花串） ================= */
const imgTree = new Image(), imgRaceme = new Image();
const imgWalk = new Image(), imgLook = new Image();
let imgOK = 0;
const IMG_TOTAL = 4;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function imgReady(){
  if (++imgOK === IMG_TOTAL){
    build();
    if (REDUCED){
      drawTree(0); // 静止模式：只画一帧
      for (const r of racemes) ctx.drawImage(imgRaceme, r.ax - r.w / 2, r.ay, r.w, r.h);
    } else {
      requestAnimationFrame(n => { last = n; requestAnimationFrame(frame); });
    }
  }
}
const racemes = []; // 垂花串（动态：钟摆+触摸）
// 树图内枝条区（分数坐标），花串挂在这里
function genRacemes(){
  racemes.length = 0;
  const n = 52 + Math.floor(rnd() * 17); // 52-68 串，每次数量不同
  for (let i = 0; i < n; i++){
    const fx = 0.06 + 0.88 * (i / (n - 1)) + R(-0.035, 0.035);
    const fy = i < 42 ? R(0.09, 0.34) : R(0.30, 0.42);
    const ax = treeX0 + treeDW * clamp(fx, 0.02, 0.98);
    const ay = treeY0 + treeDH * fy;
    const len = R(150, 290) * S;
    racemes.push({
      ax, ay, w: len / (918 / 210), h: len,
      a: 0, av: 0, phase: R(0, TAU),
      ox: 0, oy: 0, ovx: 0, ovy: 0,
    });
  }
}
function drawTree(now){
  const t = now * 0.001;
  const sx = Math.sin(t * 0.9) * wind.v * 5; // 极轻微整体摇曳
  ctx.drawImage(imgTree, treeX0 + sx, treeY0, treeDW, treeDH);
  // 地面阴影
  const shx = treeX0 + treeDW / 2 + sx, shy = groundY + 16 * S;
  const shg = ctx.createRadialGradient(shx, shy, 4, shx, shy, 120 * S);
  shg.addColorStop(0, 'rgba(90,80,70,0.14)');
  shg.addColorStop(1, 'rgba(90,80,70,0)');
  ctx.fillStyle = shg;
  ctx.fillRect(shx - 130 * S, shy - 24 * S, 260 * S, 48 * S);
}
function drawRacemes(now, dt){
  const t = now * 0.001;
  for (const r of racemes){
    const targetA = Math.sin(t * 1.15 + r.phase) * (0.035 + wind.v * 0.20)
                    + wind.v * windDirS * 0.12;
    r.av += ((targetA - r.a) * 28 - r.av * 4.5) * dt;
    r.a += r.av * dt;
    r.ovx += (-r.ox * 90 - r.ovx * 7) * dt; r.ox += r.ovx * dt;
    r.ovy += (-r.oy * 90 - r.ovy * 7) * dt; r.oy += r.ovy * dt;
    ctx.save();
    ctx.translate(r.ax + r.ox, r.ay + r.oy);
    ctx.rotate(r.a);
    ctx.drawImage(imgRaceme, -r.w / 2, 0, r.w, r.h);
    ctx.restore();
  }
}

/* ================= 风 ================= */
const wind = { v: 0.08, target: 0.08, holdUntil: 0, dir: 1 };
function updateWind(now, dt){
  if (now > wind.holdUntil){
    if (rnd() < 0.38){
      wind.target = R(0.5, 0.9);
      wind.holdUntil = now + R(4000, 8000);
      if (rnd() < 0.25) wind.dir *= -1;
    } else {
      wind.target = R(0.04, 0.16);
      wind.holdUntil = now + R(7000, 16000);
    }
  }
  const k = 1 - Math.exp(-dt * 1.4);
  wind.v += (wind.target - wind.v) * k;
  windDirS = wind.dir;
}

/* ================= 触摸：拨开枝叶 ================= */
const pointer = { active: false, x: 0, y: 0, vx: 0, vy: 0 };
function setPointer(e){
  const nx = e.clientX, ny = e.clientY;
  if (pointer.active){
    pointer.vx = pointer.vx * 0.6 + (nx - pointer.x) * 0.4 * 60;
    pointer.vy = pointer.vy * 0.6 + (ny - pointer.y) * 0.4 * 60;
  }
  pointer.x = nx; pointer.y = ny;
}
addEventListener('pointerdown', e => {
  pointer.active = true; pointer.vx = 0; pointer.vy = 0;
  setPointer(e); initAudio(); resumeAudio();
});
addEventListener('touchstart', () => { initAudio(); resumeAudio(); }, { passive: true });
addEventListener('pointermove', e => {
  if (!pointer.active) return;
  setPointer(e);
  // 快速划动打落花瓣
  const sp = Math.hypot(pointer.vx, pointer.vy);
  if (sp > 900 && petals.length < 30 && rnd() < 0.5)
    spawnPetalAt(pointer.x + R(-30, 30), pointer.y + R(-30, 30), sp);
});
addEventListener('pointerup', () => { resumeAudio(); });
const endPointer = () => { pointer.active = false; };
addEventListener('pointerup', endPointer);
addEventListener('pointercancel', endPointer);
addEventListener('keydown', () => { initAudio(); resumeAudio(); });
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if (!document.hidden) resumeAudio();
});
function resumeAudio(){
  if (amb.ok && amb.ac && amb.ac.state === 'suspended'){
    amb.ac.resume().catch(() => {});
  }
}

/* 弹簧：被拨开后弹回 */
function springTouch(e, dt){
  const Rr = 150 * S;
  if (pointer.active){
    // 花串中点
    const mx = e.ax + Math.sin(e.a) * e.h * 0.45 + e.ox;
    const my = e.ay + e.h * 0.45 + e.oy;
    const dx = mx - pointer.x, dy = my - pointer.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < Rr * Rr){
      const d = Math.sqrt(d2) || 1;
      const f = 1 - d / Rr;
      e.ovx += ((dx / d) * f * 1100 + pointer.vx * f * 2.4) * dt;
      e.ovy += ((dy / d) * f * 1100 + pointer.vy * f * 2.4) * dt;
    }
  }
}

/* ================= 落花 ================= */
let petals = [];
let petalAcc = 0;
function spawnPetal(){
  if (racemes.length === 0) return;
  const r = racemes[(rnd() * racemes.length) | 0];
  const t = R(0.2, 0.9);
  spawnPetalAt(
    r.ax + Math.sin(r.a) * r.h * t + r.ox + R(-14, 14) * S,
    r.ay + Math.cos(r.a) * r.h * t + r.oy, 0);
}
function spawnPetalAt(x, y, kick){
  if (petals.length > 34) return;
  petals.push({
    x, y, vx: R(-40, 40) * S + (kick ? R(-1, 1) * kick * 0.25 : 0),
    s: R(2.5, 4.5) * S, vy: R(24, 48) * S, ph: R(0, TAU), sw: R(.5, 1.2),
    rot: R(0, TAU), vr: R(-1.5, 1.5), a: 0,
    col: [R(120, 160) | 0, R(95, 130) | 0, R(170, 200) | 0],
    drift: R(6, 20),
  });
}
function updatePetals(dt){
  petalAcc += dt * (0.7 + wind.v * 6);
  while (petalAcc > 1 && petals.length < 34){
    petalAcc -= 1;
    spawnPetal();
  }
  for (let i = petals.length - 1; i >= 0; i--){
    const p = petals[i];
    p.vy = Math.min(p.vy + 30 * dt, 60 * S);
    p.y += p.vy * dt; p.ph += dt * 1.3; p.rot += p.vr * dt;
    p.x += (p.vx + Math.sin(p.ph) * p.sw * 24 * S + p.drift * wind.v * wind.dir * S) * dt;
    p.vx *= (1 - Math.min(1, dt * 1.5));
    p.a = Math.min(.9, p.a + dt);
    if (p.y > groundY + 6) p.a -= dt * 2.2;
    if (p.a <= 0 && p.y > groundY){ petals.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${Math.max(p.a, 0).toFixed(2)})`;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.s, p.s * 0.7, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

/* ================= 动态枝叶绘制（图片版在上方已定义 drawTree/drawRacemes） ================= */
function applyTouchRacemes(dt){
  for (const r of racemes) springTouch(r, dt);
}

/* ================= 鸟 ================= */
let birds = [];
let nextBirdAt = 0;
function scheduleBird(now, first){
  nextBirdAt = now + (first ? R(9000, 22000) : R(35000, 95000));
}
function spawnBirds(){
  const kind = rnd();
  const dir = rnd() < 0.5 ? 1 : -1;
  const speed = W * R(0.06, 0.10);
  if (kind < 0.5){
    const n = rnd() < 0.65 ? 1 : 2;
    for (let i = 0; i < n; i++)
      birds.push(makeBird(false, dir, H * R(0.22, 0.45) + R(-20, 20), speed * R(0.9, 1.1), i * R(70, 130)));
  } else if (kind < 0.8){
    const n = 4 + Math.floor(rnd() * 4);
    const y = H * R(0.08, 0.25);
    for (let i = 0; i < n; i++){
      const row = Math.ceil(i / 2);
      birds.push(makeBird(true, dir, y + row * R(24, 38), speed * R(0.95, 1.05), i * R(40, 80) + row * 60));
      const b = birds[birds.length - 1];
      b.x += dir * -row * R(46, 70);
    }
  } else {
    for (let i = 0; i < 2; i++)
      birds.push(makeBird(false, dir, H * R(0.3, 0.5), speed * 1.15 * R(0.95, 1.05), i * R(90, 150)));
  }
}
function makeBird(far, dir, y, speed, trail){
  return {
    far, dir, y0: y, speed: speed * dir,
    x: dir > 0 ? -60 - trail : W + 60 + trail,
    ph: R(0, TAU), flapSpeed: R(7, 10),
    size: (far ? R(7, 11) : R(15, 22)) * S,
    alpha: far ? R(0.5, 0.65) : R(0.8, 0.9),
    bob: R(8, 20), bobF: R(0.5, 0.9),
    glideT: 0, flapT: R(1, 3),
  };
}
function drawBird(b, y){
  const s = b.size;
  const gliding = b.glideT > 0;
  const flap = gliding ? 0.15 : Math.sin(b.ph);
  ctx.save();
  ctx.translate(b.x, y);
  if (b.dir < 0) ctx.scale(-1, 1);
  if (b.far){
    ctx.strokeStyle = `rgba(110,114,118,${b.alpha})`;
    ctx.lineWidth = Math.max(1.5, s * 0.2); ctx.lineCap = 'round';
    const w = flap * s * 0.85;
    ctx.beginPath();
    ctx.moveTo(-s, -w * 0.35);
    ctx.quadraticCurveTo(-s * 0.4, -w, 0, 0);
    ctx.quadraticCurveTo(s * 0.4, -w, s, -w * 0.35);
    ctx.stroke();
  } else {
    const ink = `rgba(82,86,90,${b.alpha})`;
    ctx.fillStyle = ink;
    ctx.beginPath(); // 尾
    ctx.moveTo(-s * 0.4, -s * 0.02);
    ctx.lineTo(-s * 0.95, -s * 0.14);
    ctx.lineTo(-s * 0.88, s * 0.08);
    ctx.closePath(); ctx.fill();
    ctx.save(); // 翅
    ctx.translate(-s * 0.02, -s * 0.04);
    ctx.rotate(-flap * 1.05 - 0.12);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-s * 0.45, -s * 0.85, -s * 1.05, -s * 1.0);
    ctx.quadraticCurveTo(-s * 0.5, -s * 0.5, s * 0.05, s * 0.06);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.beginPath(); // 身体
    ctx.ellipse(0, 0, s * 0.52, s * 0.2, -0.06, 0, TAU);
    ctx.fill();
    ctx.beginPath(); // 头
    ctx.arc(s * 0.44, -s * 0.07, s * 0.15, 0, TAU);
    ctx.fill();
    ctx.beginPath(); // 喙
    ctx.moveTo(s * 0.56, -s * 0.09);
    ctx.lineTo(s * 0.72, -s * 0.03);
    ctx.lineTo(s * 0.56, s * 0.0);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function updateBirds(dt, now){
  if (now > nextBirdAt){ spawnBirds(); scheduleBird(now, false); }
  for (let i = birds.length - 1; i >= 0; i--){
    const b = birds[i];
    b.x += b.speed * dt; b.ph += dt * b.flapSpeed;
    if (b.glideT > 0) b.glideT -= dt;
    else {
      b.flapT -= dt;
      if (b.flapT <= 0){ b.glideT = R(0.8, 2.2); b.flapT = R(1.5, 4); }
    }
    const y = b.y0 + Math.sin(now * 0.001 * b.bobF + b.ph) * b.bob;
    drawBird(b, y);
    if ((b.dir > 0 && b.x > W + 90) || (b.dir < 0 && b.x < -90)) birds.splice(i, 1);
  }
}

/* ================= 环境音（WebAudio 合成） ================= */
const amb = { ok: false };
function initAudio(){
  if (amb.ok) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    amb.ac = ac;
    // 粉噪（柔和，似自然风）+ 棕噪（低频 body），4 秒循环
    const secs = 4, len = Math.floor(ac.sampleRate * secs);
    const pinkBuf = ac.createBuffer(1, len, ac.sampleRate);
    const pd = pinkBuf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < len; i++){
      const wht = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + wht*0.0555179; b1 = 0.99332*b1 + wht*0.0750759;
      b2 = 0.96900*b2 + wht*0.1538520; b3 = 0.86650*b3 + wht*0.3104856;
      b4 = 0.55000*b4 + wht*0.5329522; b5 = -0.7616*b5 - wht*0.0168980;
      pd[i] = (b0+b1+b2+b3+b4+b5+b6+wht*0.5362) * 0.11;
      b6 = wht * 0.115926;
    }
    const brownBuf = ac.createBuffer(1, len, ac.sampleRate);
    const bd = brownBuf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++){
      const wht = Math.random() * 2 - 1;
      last = (last + 0.02 * wht) / 1.02;
      bd[i] = last * 3.5;
    }
    const loopSrc = (buf) => {
      const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s;
    };
    const chain = (buf, type, freq, q) => {
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ac.createGain(); g.gain.value = 0;
      loopSrc(buf).connect(f); f.connect(g); g.connect(ac.destination);
      return { f, g };
    };
    amb.wind = chain(pinkBuf, 'lowpass', 500, 0.5);   // 主风：粉噪，柔和
    amb.deep = chain(brownBuf, 'lowpass', 170, 0.5);  // 低频 body，阵风时起
    amb.rustle = chain(pinkBuf, 'highpass', 4200, 0.6); // 叶动
    amb.song = ac.createGain();                // 鸟鸣母线
    const delay = ac.createDelay(1); delay.delayTime.value = 0.31;
    const fb = ac.createGain(); fb.gain.value = 0.3;
    const wet = ac.createGain(); wet.gain.value = 0.22;
    amb.song.connect(ac.destination);
    amb.song.connect(delay); delay.connect(fb); fb.connect(delay);
    delay.connect(wet); wet.connect(ac.destination);
    amb.ok = true;
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { /* 无声也不影响画面 */ }
}
function updateAmbient(now, dt){
  if (!amb.ok) return;
  const w = wind.v, t = now * 0.001;
  const sm = (p, target, k) => { p.value += (target - p.value) * Math.min(1, dt * k); };
  // 有机起伏：两层极慢 LFO，让风有呼吸感，不单调
  const lfo1 = Math.sin(t * 0.13 + 1.7) * 0.5 + Math.sin(t * 0.071 + 0.4) * 0.5;
  const lfo2 = Math.sin(t * 0.21 + 3.1) * 0.5 + Math.sin(t * 0.113 + 1.2) * 0.5;
  // 主风：粉噪一直有底，阵风时起来，叠加呼吸起伏
  sm(amb.wind.g.gain, (0.035 + w * 0.38) * (1 + lfo1 * 0.28), 2.0);
  amb.wind.f.frequency.value = 380 + w * 380 + lfo2 * 130;
  // 低频 body：只在阵风时出来，有厚度
  sm(amb.deep.g.gain, w * w * 0.5, 1.5);
  // 叶动：高频 + 扑簌颤动（不是恒定嘶声）
  const trem = 0.6 + 0.4 * Math.sin(t * 9.3) * Math.sin(t * 6.1 + 2.0);
  const rT = Math.pow(Math.max(0, w - 0.18), 1.4) * 0.5 * trem;
  sm(amb.rustle.g.gain, rT, 5);
}

/* 远处鸟鸣 */
const song = { nextAt: 0 };
function scheduleSong(now, first){
  song.nextAt = now + (first ? R(20000, 45000) : R(55000, 150000));
}
function playSong(){
  if (!amb.ok) return;
  const ac = amb.ac;
  if (ac.state === 'suspended') ac.resume();
  const t0 = ac.currentTime + 0.1;
  const phrases = 2 + Math.floor(rnd() * 4);
  let t = t0;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = R(2600, 3600); bp.Q.value = 1.1;
  const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
  if (pan){ pan.pan.value = R(-0.5, 0.5); bp.connect(pan); pan.connect(amb.song); }
  else bp.connect(amb.song);
  for (let p = 0; p < phrases; p++){
    const chirps = 2 + Math.floor(rnd() * 3);
    for (let c = 0; c < chirps; c++){
      const dur = R(0.09, 0.24), f0 = R(2800, 4200), f1 = f0 * R(0.6, 0.85);
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(f1, 400), t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(R(0.5, 0.9), t + 0.025);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(bp);
      o.start(t); o.stop(t + dur + 0.05);
      t += dur + R(0.05, 0.16);
    }
    t += R(0.5, 1.3);
  }
  const total = t - t0 + 1;
  const peak = R(0.05, 0.09);
  const mg = amb.song.gain;
  mg.cancelScheduledValues(t0);
  mg.setValueAtTime(0.0001, t0);
  mg.linearRampToValueAtTime(peak, t0 + 2.2);
  mg.setValueAtTime(peak, t0 + Math.max(2.3, total - 3));
  mg.linearRampToValueAtTime(0.0001, t0 + total);
}
function updateSong(now){
  if (now > song.nextAt){ playSong(); scheduleSong(now, false); }
}

/* ================= 行人 ================= */
let walkers = [];
let nextWalkAt = 0;
function scheduleWalk(now, first){
  nextWalkAt = now + (first ? R(30000, 70000) : R(80000, 180000));
}
function spawnWalkers(){
  const dir = rnd() < 0.5 ? 1 : -1;
  const n = rnd() < 0.7 ? 1 : 2;
  const hBase = H * R(0.105, 0.13);
  for (let i = 0; i < n; i++){
    walkers.push({
      dir, h: hBase * R(0.92, 1.08),
      x: dir > 0 ? -40 - i * R(70, 110) : W + 40 + i * R(70, 110),
      speed: dir * R(34, 52),
      phase: R(0, TAU), stride: R(4.4, 5.4),
      state: 'walk', pauseT: 0, lookK: 0,
      tone: R(95, 125) | 0, looked: false,
    });
  }
}
function drawWalker(w, dt){
  const h = w.h, gy = groundY + 4;
  const walking = w.state === 'walk';
  if (walking) w.phase += dt * w.stride;
  const img = walking ? imgWalk : imgLook;
  const bob = walking ? Math.abs(Math.sin(w.phase)) * h * 0.022 : 0;
  const iw = img === imgWalk ? 300 / 640 : 300 / 1064; // 宽高比
  const dw = h * iw, dh = h;
  ctx.save();
  ctx.translate(w.x, gy - bob);
  if (w.dir < 0) ctx.scale(-1, 1);
  ctx.drawImage(img, -dw / 2, -dh, dw, dh);
  ctx.restore();
}
function updateWalkers(dt, now){
  if (now > nextWalkAt){ spawnWalkers(); scheduleWalk(now, false); }
  for (let i = walkers.length - 1; i >= 0; i--){
    const w = walkers[i];
    if (w.state === 'walk'){
      w.x += w.speed * dt;
      const stopX = treeX0 + treeDW / 2 + (w.dir > 0 ? -R(46, 80) : R(46, 80));
      if (!w.looked && ((w.dir > 0 && w.x >= stopX) || (w.dir < 0 && w.x <= stopX))){
        w.state = 'pause'; w.pauseT = R(4, 8); w.looked = true;
      }
    } else {
      w.pauseT -= dt;
      if (w.pauseT <= 0) w.state = 'walk';
    }
    drawWalker(w, dt);
    if ((w.dir > 0 && w.x > W + 60) || (w.dir < 0 && w.x < -60)) walkers.splice(i, 1);
  }
}

/* ================= 主循环 ================= */
let last = 0, running = true;

function frame(now){
  requestAnimationFrame(frame);
  if (!running) return;
  const dt = Math.min((now - last) / 1000 || 0, 0.05); last = now;
  frameDt = dt;
  updateWind(now, dt);
  updateAmbient(now, dt);
  ctx.clearRect(0, 0, W, H);
  drawTree(now);
  updateWalkers(dt, now);
  applyTouchRacemes(dt);
  drawRacemes(now, dt);
  updatePetals(dt);
  updateBirds(dt, now);
  updateSong(now);
}

function build(){
  size();
  genRacemes();
  petals = []; birds = []; walkers = [];
  petalAcc = 0;
  const now = performance.now();
  wind.holdUntil = now + R(9000, 20000);
  scheduleBird(now, true); scheduleSong(now, true); scheduleWalk(now, true);
}
