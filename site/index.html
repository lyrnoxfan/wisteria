<script>
  // 首帧前按本地时间先铺好天色，避免夜里白屏一闪
  (function () {
    var q = new URLSearchParams(location.search), d = new Date();
    var h = q.has('hour') ? parseFloat(q.get('hour')) : d.getHours() + d.getMinutes() / 60;
    var c = h < 4.9 || h >= 19.5 ? '#121726' : h < 5.6 || h >= 18.7 ? '#40456a' : h < 6.6 || h >= 17.6 ? '#e6d2c8' : '#fbfaf7';
    document.documentElement.style.background = c;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', c);
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { background: #fbfaf7; transition: background-color 1.5s linear; }
  body {
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .controls { position: fixed; z-index: 2; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  .controls button { border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 9px 13px; color: #fff; background: rgba(25,28,38,.48); font: 500 13px/1.2 system-ui, sans-serif; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); cursor: pointer; }
  .controls button:focus-visible { outline: 3px solid #f4d58d; outline-offset: 3px; }
  .notice { position: fixed; z-index: 3; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); max-width: min(90vw, 420px); padding: 10px 14px; border-radius: 12px; color: #fff; background: rgba(25,28,38,.82); font: 14px/1.45 system-ui, sans-serif; text-align: center; }
  @media (prefers-reduced-motion: reduce) { html { transition: none; } }
</style>
</head>
<body>
<canvas id="fuji" role="img" tabindex="0" aria-label="一棵日本紫藤，花串随风摆动，鸟偶尔飞来，行人在树下驻足。聚焦后按空格或回车轻拨花串"></canvas>
<div class="controls" aria-label="场景控制">
  <button id="motion-toggle" type="button" aria-label="切换动画强度">完整动态</button>
  <button id="sound-toggle" type="button" aria-label="静音环境音">声音：开</button>
</div>
<div id="scene-notice" class="notice" role="status" aria-live="polite" hidden></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
